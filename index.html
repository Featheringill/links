<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.A. Featheringill</title>
<meta name="description" content="Books, crochet patterns, and art by L.A. Featheringill.">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f7f4f0; color: #2c2825;
    font-family: Georgia, "Times New Roman", serif;
    display: flex; justify-content: center; }
  main { width: 100%; max-width: 30rem; padding: 3rem 1.25rem 2rem; text-align: center; }
  h1 { font-size: 2rem; font-weight: normal; letter-spacing: 0.04em; margin: 0 0 0.4rem; }
  .sub { margin: 0 0 2.25rem; font-size: 1.05rem; color: #6b5f54; }
  a.card, div.card { display: block; text-decoration: none; color: inherit;
    background: #ffffff; border: 1px solid #d4ccc3; border-radius: 14px;
    padding: 1.15rem 1.25rem; margin: 0 0 1rem; text-align: left; }
  a.card:hover, a.card:focus-visible { border-color: #2c2825; outline: none; }
  .name { display: block; font-size: 1.25rem; margin-bottom: 0.25rem; }
  .what { display: block; font-size: 0.98rem; color: #6b5f54;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  div.card { background: transparent; border-style: dashed; }
  .soon { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: #8c7b6b; }
  footer { margin-top: 2rem; font-size: 0.85rem; color: #8c7b6b;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>L.A. Featheringill</h1>
  <p class="sub">Books, crochet patterns, and art</p>

  <a class="card" href="https://www.threshold-press.com">
    <span class="name">Threshold Press</span>
    <span class="what">Rare esoteric texts in English translation</span>
  </a>

  <a class="card" href="https://crochettrue.com">
    <span class="name">CrochetTrue</span>
    <span class="what">A crochet pattern marketplace built by a crocheter</span>
  </a>

  <div class="card">
    <span class="name">Color Riot</span>
    <span class="what">Porcelain, crochet, and design</span>
    <span class="soon">Site coming soon</span>
  </div>

  <footer>Indianapolis, Indiana</footer>
</main>
</body>
</html>
